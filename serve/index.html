<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<title>ES API — Endpoint Security Reference</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── Dark theme (default) ──────────────────────────────────────── */
:root, [data-theme="dark"] {
  --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d;
  --border: #3e3e42; --border-subtle: #2a2a2a;
  --text: #cccccc; --text2: #888; --text3: #555; --text-bright: #ffffff;
  --sel: #094771; --sel-text: #fff;
  --accent-blue: #4fc1ff; --accent-purple: #c586c0;
  --accent-green: #4ec9b0; --accent-yellow: #dcdcaa;
  --badge-auth: #5a1d1d; --badge-auth-text: #f97171;
  --badge-notify: #1a3a1a; --badge-notify-text: #7dc97d;
  --badge-ver: #1a2a3a; --badge-ver-text: #4fc1ff;
  --badge-reserved: #2a2a00; --badge-reserved-text: #cccc44;
  --type-link-hover: #e0a0ff;
  --note-border: #444;
}

/* ─── Light theme ────────────────────────────────────────────────── */
[data-theme="light"] {
  --bg: #f8f8f8; --bg2: #efefef; --bg3: #e4e4e4;
  --border: #d0d0d0; --border-subtle: #e0e0e0;
  --text: #1a1a1a; --text2: #555; --text3: #999; --text-bright: #000000;
  --sel: #0078d4; --sel-text: #fff;
  --accent-blue: #0066cc; --accent-purple: #7b3ea0;
  --accent-green: #1b7a6e; --accent-yellow: #7a6400;
  --badge-auth: #ffe5e5; --badge-auth-text: #bb0000;
  --badge-notify: #e5ffe5; --badge-notify-text: #005500;
  --badge-ver: #e0f0ff; --badge-ver-text: #0055aa;
  --badge-reserved: #fffadc; --badge-reserved-text: #7a6200;
  --type-link-hover: #5a0090;
  --note-border: #bbb;
}

/* ─── Auto theme ─────────────────────────────────────────────────── */
@media (prefers-color-scheme: light) {
  [data-theme="auto"] {
    --bg: #f8f8f8; --bg2: #efefef; --bg3: #e4e4e4;
    --border: #d0d0d0; --border-subtle: #e0e0e0;
    --text: #1a1a1a; --text2: #555; --text3: #999; --text-bright: #000000;
    --sel: #0078d4; --sel-text: #fff;
    --accent-blue: #0066cc; --accent-purple: #7b3ea0;
    --accent-green: #1b7a6e; --accent-yellow: #7a6400;
    --badge-auth: #ffe5e5; --badge-auth-text: #bb0000;
    --badge-notify: #e5ffe5; --badge-notify-text: #005500;
    --badge-ver: #e0f0ff; --badge-ver-text: #0055aa;
    --badge-reserved: #fffadc; --badge-reserved-text: #7a6200;
    --type-link-hover: #5a0090;
    --note-border: #bbb;
  }
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d;
    --border: #3e3e42; --border-subtle: #2a2a2a;
    --text: #cccccc; --text2: #888; --text3: #555; --text-bright: #ffffff;
    --sel: #094771; --sel-text: #fff;
    --accent-blue: #4fc1ff; --accent-purple: #c586c0;
    --accent-green: #4ec9b0; --accent-yellow: #dcdcaa;
    --badge-auth: #5a1d1d; --badge-auth-text: #f97171;
    --badge-notify: #1a3a1a; --badge-notify-text: #7dc97d;
    --badge-ver: #1a2a3a; --badge-ver-text: #4fc1ff;
    --badge-reserved: #2a2a00; --badge-reserved-text: #cccc44;
    --type-link-hover: #e0a0ff;
    --note-border: #444;
  }
}

html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ─── Toolbar ─────────────────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative;
}
.logo { font-weight: 700; font-size: 13px; color: var(--accent-blue); white-space: nowrap; margin-right: 2px; }
#search {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); padding: 5px 10px; border-radius: 4px; font-size: 13px; outline: none;
}
#search:focus { border-color: var(--accent-blue); }
.filter-btn {
  padding: 3px 9px; border: 1px solid var(--border); background: transparent;
  color: var(--text2); border-radius: 4px; cursor: pointer; font-size: 11px;
  font-weight: 600; transition: color 0.1s, border-color 0.1s, background 0.1s; white-space: nowrap;
}
.filter-btn.active { color: var(--accent-blue); border-color: var(--accent-blue); background: var(--badge-ver); }
.filter-btn:hover:not(.active) { color: var(--text); border-color: var(--text3); }
.ver-group { display: flex; align-items: center; gap: 5px; color: var(--text2); font-size: 11px; white-space: nowrap; }
#ver-slider { width: 70px; accent-color: var(--accent-blue); }
#ver-num {
  width: 38px; background: transparent; border: 1px solid transparent;
  color: var(--accent-blue); font-weight: 600; font-size: 11px;
  font-family: 'SF Mono', monospace; text-align: center;
  border-radius: 3px; padding: 1px 2px; outline: none;
  -moz-appearance: textfield;
}
#ver-num::-webkit-inner-spin-button,
#ver-num::-webkit-outer-spin-button { display: none; }
#ver-num:hover, #ver-num:focus {
  border-color: var(--accent-blue); background: var(--bg3);
}

/* ─── Prefs button & panel ────────────────────────────────────────── */
#prefs-wrap { position: relative; }
#btn-prefs { font-size: 14px; line-height: 1; padding: 3px 7px; }
.prefs-panel {
  display: none; position: absolute; top: calc(100% + 6px); right: 0;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; z-index: 200; min-width: 200px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.prefs-panel.open { display: block; }
.pref-row { margin-bottom: 12px; }
.pref-row:last-child { margin-bottom: 0; }
.pref-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text3); margin-bottom: 6px; }
.pref-btns { display: flex; gap: 4px; flex-wrap: wrap; }
.pref-btn {
  padding: 3px 10px; border: 1px solid var(--border); background: var(--bg3);
  color: var(--text2); border-radius: 4px; cursor: pointer; font-size: 11px;
}
.pref-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); background: var(--badge-ver); }
.pref-btn:hover:not(.active) { border-color: var(--text3); color: var(--text); }

/* ─── Main layout ─────────────────────────────────────────────────── */
#body { display: flex; flex: 1; overflow: hidden; }

/* ─── Sidebar ─────────────────────────────────────────────────────── */
#sidebar-wrap { width: 270px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#sidebar-pin { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2); display: flex; flex-direction: row; gap: 5px; }
#btn-changelog, #btn-eventmap {
  flex: 1; text-align: center; background: transparent;
  border: 1px solid var(--border); color: var(--text2);
  border-radius: 4px; padding: 5px 10px; cursor: pointer;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}
#btn-changelog.active, #btn-eventmap.active { color: var(--accent-blue); border-color: var(--accent-blue); background: var(--badge-ver); }
#btn-changelog:hover:not(.active), #btn-eventmap:hover:not(.active) { color: var(--text); border-color: var(--text3); }
#sidebar { overflow-y: auto; flex: 1; }
.section-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 10px 7px 12px; background: var(--bg2); border-bottom: 1px solid var(--border);
  cursor: pointer; position: sticky; top: 0; z-index: 1; user-select: none;
}
.section-hdr span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); }
.section-hdr .count { font-size: 10px; color: var(--text3); font-weight: 400; }
.section-hdr .arrow { font-size: 10px; color: var(--text3); transition: transform 0.15s; }
.section-hdr.collapsed .arrow { transform: rotate(-90deg); }
.section-body.collapsed { display: none; }

.sb-item {
  padding: 5px 12px; cursor: pointer; border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 5px; overflow: hidden;
  color: var(--text); line-height: 1.4;
}
.sb-item:hover { background: var(--bg3); }
.sb-item.active { background: var(--sel); color: var(--sel-text); }
.sb-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'SF Mono', 'Menlo', monospace; font-size: 12px; }
.sb-item .badges { display: flex; gap: 3px; flex-shrink: 0; }
.badge {
  font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px;
  font-family: -apple-system, sans-serif; letter-spacing: 0.3px; white-space: nowrap;
}
.badge-auth     { background: var(--badge-auth);     color: var(--badge-auth-text); }
.badge-notify   { background: var(--badge-notify);   color: var(--badge-notify-text); }
.badge-ver      { background: var(--badge-ver);      color: var(--badge-ver-text); }
.badge-reserved { background: var(--badge-reserved); color: var(--badge-reserved-text); }
.macos { font-size: 10px; color: var(--text3); flex-shrink: 0; margin-left: auto; padding-left: 4px; }

/* ─── Detail pane ─────────────────────────────────────────────────── */
#detail { flex: 1; overflow-y: auto; padding: 20px 24px; }
.placeholder { color: var(--text3); text-align: center; margin-top: 60px; font-size: 14px; line-height: 1.8; }

.detail-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.detail-title { font-family: 'SF Mono', 'Menlo', monospace; font-size: 17px; font-weight: 600; color: var(--text-bright); }
.apple-docs-link {
  font-size: 11px; color: var(--text3); text-decoration: none; border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 3px; white-space: nowrap; flex-shrink: 0;
  transition: color 0.1s, border-color 0.1s;
}
.apple-docs-link:hover { color: var(--accent-blue); border-color: var(--accent-blue); }

.detail-brief { color: var(--text2); font-size: 13px; line-height: 1.6; margin-bottom: 16px; max-width: 720px; }
.event-tags { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.event-tag { font-family: 'SF Mono', monospace; font-size: 11px; color: var(--text2); background: var(--bg3); padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
.event-tag-num { font-family: 'SF Mono', monospace; font-size: 10px; color: var(--text3); background: var(--bg2); border: 1px solid var(--border-subtle); border-radius: 2px; padding: 0 4px; }
.macos-tag { font-size: 11px; color: var(--text3); }

.fields-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 20px; }
.fields-table th { text-align: left; padding: 5px 10px; color: var(--text3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); font-weight: 600; }
.fields-table td { padding: 7px 10px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
.fields-table tr:hover td { background: var(--bg3); }
.field-name { font-family: 'SF Mono', 'Menlo', monospace; color: var(--accent-blue); }
.field-type { font-family: 'SF Mono', 'Menlo', monospace; color: var(--accent-purple); }
.type-link { font-family: 'SF Mono', 'Menlo', monospace; color: var(--accent-purple); cursor: pointer; text-decoration: underline; text-decoration-color: var(--text3); text-underline-offset: 2px; }
.type-link:hover { color: var(--type-link-hover); }
.field-doc { color: var(--text2); line-height: 1.5; max-width: 400px; font-size: 12px; }
.field-dimmed { opacity: 0.25; }
.union-mark { font-size: 10px; color: var(--text3); margin-left: 3px; }

.values-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 20px; }
.values-table th { text-align: left; padding: 5px 10px; color: var(--text3); font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); font-weight: 600; }
.values-table td { padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
.values-table tr:hover td { background: var(--bg3); }
.val-name { font-family: 'SF Mono', 'Menlo', monospace; color: var(--accent-green); font-size: 12px; }
.val-num { font-family: 'SF Mono', 'Menlo', monospace; color: var(--text3); }
.val-doc { color: var(--text2); }

.notes-section { margin-top: 4px; }
.note { background: var(--bg2); border-left: 3px solid var(--note-border); padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: var(--text2); border-radius: 0 3px 3px 0; line-height: 1.6; max-width: 720px; }
.reserved-note { background: var(--badge-reserved); border-left: 3px solid var(--badge-reserved-text); color: var(--badge-reserved-text); padding: 8px 12px; border-radius: 0 3px 3px 0; font-size: 12px; margin-bottom: 14px; max-width: 720px; }

/* ─── macOS filter ────────────────────────────────────────────────── */
#macos-filter, #event-filter {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text2); padding: 3px 6px; border-radius: 4px;
  font-size: 11px; cursor: pointer; outline: none;
}
#macos-filter:focus, #event-filter:focus { border-color: var(--accent-blue); color: var(--text); }

/* ─── Class view button & grouping ───────────────────────────────── */
.class-view-btn {
  font-size: 10px; padding: 1px 5px; border: 1px solid transparent;
  background: transparent; color: var(--text3); border-radius: 3px;
  cursor: pointer; margin-left: 5px; font-weight: 700; vertical-align: middle;
}
.class-view-btn.active { color: var(--accent-blue); border-color: var(--accent-blue); background: var(--badge-ver); }
.class-view-btn:hover:not(.active) { color: var(--text); border-color: var(--text3); }
.class-sec-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 12px; background: var(--bg2); border-bottom: 1px solid var(--border-subtle);
  cursor: pointer; user-select: none; position: sticky; top: 28px; z-index: 1;
}
.class-sec-hdr:hover { background: var(--bg3); }
.class-sec-name { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; }
.class-sec-count { font-size: 10px; color: var(--text3); margin-left: 4px; font-weight: 400; }
.class-sec-arrow { font-size: 9px; color: var(--text3); transition: transform 0.15s; }
.class-sec-hdr.collapsed .class-sec-arrow { transform: rotate(-90deg); }

/* ─── Source view ─────────────────────────────────────────────────── */
.src-toggle-btn {
  font-size: 10px; font-family: 'SF Mono', monospace; padding: 2px 8px;
  border: 1px solid var(--border); background: transparent; color: var(--text3);
  border-radius: 3px; cursor: pointer; flex-shrink: 0;
}
.src-toggle-btn.active { color: var(--accent-green); border-color: var(--accent-green); }
.src-toggle-btn:hover:not(.active) { color: var(--text); border-color: var(--text3); }
.md-link {
  font-size: 10px; font-family: 'SF Mono', monospace; padding: 2px 8px;
  border: 1px solid var(--border); color: var(--text3); border-radius: 3px;
  text-decoration: none; flex-shrink: 0; margin-left: auto;
}
.md-link + .src-toggle-btn { margin-left: 6px; }
.md-link:hover { color: var(--text); border-color: var(--text3); }
.source-view {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 14px 16px; overflow-x: auto; font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 12px; line-height: 1.65; color: var(--text); white-space: pre; max-width: 100%;
  margin-bottom: 16px; tab-size: 4;
}
.src-comment { color: var(--text3); }
.src-kw { color: var(--accent-purple); }
.src-type { color: var(--accent-green); }
.no-src { color: var(--text3); font-size: 12px; font-style: italic; margin-bottom: 16px; }

/* ─── Changelog view ──────────────────────────────────────────────── */
.cl-page-title { font-size: 16px; font-weight: 700; color: var(--text-bright); }
.cl-section { margin-bottom: 28px; }
.cl-ver-hdr {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.cl-ver-label {
  font-family: 'SF Mono', monospace; font-size: 14px; font-weight: 700;
  color: var(--text-bright);
}
.cl-macos-label { font-size: 11px; color: var(--text3); }
.cl-subsection { margin-bottom: 14px; }
.cl-sub-hdr { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--text3); margin-bottom: 6px; }
.cl-struct-group { margin-bottom: 10px; }
.cl-struct-name {
  font-family: 'SF Mono', monospace; font-size: 12px; color: var(--accent-purple);
  cursor: pointer; margin-bottom: 4px;
}
.cl-struct-name:hover { color: var(--type-link-hover); text-decoration: underline;
  text-underline-offset: 2px; }
.cl-field-row { display: flex; align-items: baseline; gap: 8px;
  padding: 3px 0 3px 12px; border-bottom: 1px solid var(--border-subtle); }
.cl-field-row:last-child { border-bottom: none; }
.cl-field-name { font-family: 'SF Mono', monospace; font-size: 12px; color: var(--accent-blue); flex-shrink: 0; }
.cl-field-type { font-family: 'SF Mono', monospace; font-size: 11px; color: var(--accent-purple); flex-shrink: 0; }
.cl-field-doc { font-size: 11px; color: var(--text2); }
.cl-event-list { display: flex; flex-wrap: wrap; gap: 5px; }
.cl-event-chip {
  font-family: 'SF Mono', monospace; font-size: 11px; padding: 2px 8px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 3px;
  color: var(--text2); cursor: pointer;
}
.cl-event-chip:hover { color: var(--accent-blue); border-color: var(--accent-blue); }
.cl-macos-hint { font-size: 10px; color: var(--text3); font-style: italic; }
.cl-copy-btn {
  font-size: 10px; font-family: 'SF Mono', monospace; padding: 2px 8px;
  border: 1px solid var(--border); background: transparent; color: var(--text3);
  border-radius: 3px; cursor: pointer; margin-left: auto; flex-shrink: 0;
  transition: color 0.1s, border-color 0.1s;
}
.cl-copy-btn:hover { color: var(--text); border-color: var(--text3); }
.cl-page-hdr { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }

/* ─── Event Map view ──────────────────────────────────────────────── */
.em-page-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.em-page-title { font-size: 16px; font-weight: 700; color: var(--text-bright); }
.em-tab-btn {
  font-size: 10px; font-family: 'SF Mono', monospace; padding: 2px 10px;
  border: 1px solid var(--border); background: transparent; color: var(--text3);
  border-radius: 3px; cursor: pointer;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}
.em-tab-btn.active { color: var(--accent-green); border-color: var(--accent-green); background: transparent; }
.em-tab-btn:hover:not(.active) { color: var(--text); border-color: var(--text3); }
.em-class-section { margin-bottom: 22px; }
.em-class-hdr {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text2); padding-bottom: 6px; border-bottom: 1px solid var(--border);
  margin-bottom: 8px; display: flex; align-items: baseline; gap: 6px;
}
.em-class-count { font-size: 10px; color: var(--text3); font-weight: 400; }
.em-event-list { display: flex; flex-wrap: wrap; gap: 5px; }
.em-chip {
  font-family: 'SF Mono', monospace; font-size: 11px; padding: 2px 8px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 3px;
  color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}
.em-chip:hover { color: var(--accent-blue); border-color: var(--accent-blue); }
.em-macos { font-size: 10px; color: var(--text3); }
.matrix-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
.matrix-table th {
  text-align: left; padding: 5px 10px; color: var(--text3); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
  font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap;
}
.matrix-table th:hover { color: var(--text); }
.matrix-sort-arrow { margin-left: 3px; font-size: 9px; }
.matrix-table td { padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
.matrix-table tr:hover td { background: var(--bg3); cursor: pointer; }
.matrix-check { color: var(--accent-green); font-weight: 700; }
.matrix-dash { color: var(--text3); }
.matrix-cat { font-family: 'SF Mono', monospace; color: var(--accent-blue); font-size: 12px; }
.matrix-class { font-size: 11px; color: var(--text2); }
.matrix-struct { font-family: 'SF Mono', monospace; font-size: 11px; color: var(--accent-purple); cursor: pointer; text-decoration: underline; text-decoration-color: var(--text3); text-underline-offset: 2px; }
.matrix-struct:hover { color: var(--type-link-hover); }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="logo">ES API</span>
    <input id="search" type="text" placeholder="Search events, structs, fields, enums" autocomplete="off" spellcheck="false">
    <select id="event-filter" title="Filter events by action type">
      <option value="all">All events</option>
      <option value="authn">AUTH + NOTIFY</option>
      <option value="auth">AUTH only</option>
      <option value="notify">NOTIFY only</option>
      <option value="rsvd">RSVD only</option>
    </select>
    <div class="ver-group">
      msg v≥<input id="ver-num" type="number" min="1" max="10" value="10" title="Minimum message version">
      <input id="ver-slider" type="range" min="1" max="10" value="10">
    </div>
    <select id="macos-filter" title="Filter events by macOS availability">
      <option value="">All macOS</option>
    </select>
    <div id="prefs-wrap">
      <button class="filter-btn" id="btn-prefs" title="Preferences">⚙</button>
      <div class="prefs-panel" id="prefs-panel">
        <div class="pref-row">
          <div class="pref-label">Appearance</div>
          <div class="pref-btns" id="pref-theme">
            <button class="pref-btn" data-val="dark">Dark</button>
            <button class="pref-btn" data-val="light">Light</button>
            <button class="pref-btn active" data-val="auto">Auto</button>
          </div>
        </div>
        <div class="pref-row">
          <div class="pref-label">UI Scale</div>
          <div class="pref-btns" id="pref-scale">
            <button class="pref-btn" data-val="80">80%</button>
            <button class="pref-btn" data-val="90">90%</button>
            <button class="pref-btn" data-val="100">100%</button>
            <button class="pref-btn active" data-val="115">115%</button>
            <button class="pref-btn" data-val="130">130%</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="body">
    <div id="sidebar-wrap">
      <div id="sidebar-pin">
        <button id="btn-changelog">Change log</button>
        <button id="btn-eventmap">Event Map</button>
      </div>
      <nav id="sidebar"></nav>
    </div>
    <main id="detail"><p class="placeholder">Select an item from the sidebar, or search.</p></main>
  </div>
</div>

<script src="generated/endpointsecurity-data.js"></script>
<script>
if (!window.ENDPOINT_SECURITY_DATA) {
  document.getElementById('detail').innerHTML =
    '<p class="placeholder">⚠ generated/endpointsecurity-data.js not found.<br>Run <code>python3 parse.py</code> first.</p>';
}

const D = window.ENDPOINT_SECURITY_DATA || {events:[], structs:{}, enums:{}};

// ─── Telemetry classification ─────────────────────────────────────────────────
const TELEMETRY_CLASSES = D.telemetryClasses;
const catToClass = {};
for (const [cls, cats] of Object.entries(TELEMETRY_CLASSES))
  for (const cat of cats) catToClass[cat] = cls;

// ─── Compute max message version from data ────────────────────────────────────
let maxVersion = 1;
for (const s of Object.values(D.structs))
  for (const f of s.fields)
    if (f.sinceVersion && f.sinceVersion > maxVersion) maxVersion = f.sinceVersion;
const verSlider = document.getElementById('ver-slider');
const verNum    = document.getElementById('ver-num');
verSlider.max   = maxVersion;
verSlider.value = maxVersion;
verNum.max      = maxVersion;
verNum.value    = maxVersion;

// ─── Build event categories ───────────────────────────────────────────────────
const eventCats = {};
for (const e of D.events) {
  if (!eventCats[e.category]) {
    eventCats[e.category] = {
      category:      e.category,
      actions:       new Set(),
      fullNames:     [],
      macosVersion:  e.macosVersion,
      struct:        e.struct,
      isReserved:    e.action === 'RESERVED',
      telemetryClass: catToClass[e.category] || 'Other',
    };
  }
  eventCats[e.category].actions.add(e.action);
  eventCats[e.category].fullNames.push(e.name);
}
const sortedCats    = Object.values(eventCats).sort((a,b) => a.category.localeCompare(b.category));
const sortedStructs = Object.keys(D.structs).sort();
const sortedEnums   = Object.keys(D.enums).sort();

// ─── Build changelog data (computed once) ─────────────────────────────────────
// byMsgVersion: { [v: number]: { fields: [{structName, field}] } }
// byMacOS:      { [v: string]: { events: [cat] } }
const CHANGELOG = (() => {
  const byMsgVersion = {};
  for (const [structName, s] of Object.entries(D.structs)) {
    for (const f of s.fields) {
      if (!f.sinceVersion) continue;
      const v = f.sinceVersion;
      if (!byMsgVersion[v]) byMsgVersion[v] = { fields: [] };
      byMsgVersion[v].fields.push({ structName, field: f });
    }
  }
  const byMacOS = {};
  for (const cat of Object.values(eventCats)) {
    const v = cat.macosVersion;
    if (!v) continue;
    if (!byMacOS[v]) byMacOS[v] = { events: [] };
    byMacOS[v].events.push(cat);
  }
  // Sort events within each macOS bucket alphabetically
  for (const b of Object.values(byMacOS))
    b.events.sort((a, b) => a.category.localeCompare(b.category));
  return { byMsgVersion, byMacOS };
})();

// ─── Event enum value lookup ──────────────────────────────────────────────────
const eventEnumValue = {};
for (const e of D.events) eventEnumValue[e.name] = e.value;
const state = {
  query:           '',
  showAuth:        true,
  showNotify:      true,
  showReserved:    true,
  minVersion:      maxVersion,
  minMacOS:        '',
  classView:       true,
  collapsedClasses: new Set(),
  showSource:      false,
  selected:        null,
  isMd:            false,
  showChangelog:   false,
  showEventMap:    false,
  eventMapTab:     'class',   // 'class' | 'matrix'
  matrixSort:      { col: 'class', dir: 'asc' },
};

// ─── Search matching ──────────────────────────────────────────────────────────
function matchStr(s, q) { return s && String(s).toLowerCase().includes(q); }

function structScore(name, q) {
  const s = D.structs[name];
  if (!s) return 0;
  if (matchStr(name, q) || matchStr(s.brief, q)) return 2;
  if (s.fields.some(f => matchStr(f.name, q) || matchStr(f.type, q) || matchStr(f.doc, q))) return 1;
  return 0;
}

function catMatches(cat, q) {
  if (!q) return true;
  if (matchStr(cat.category, q)) return true;
  if (cat.fullNames.some(n => matchStr(n, q))) return true;
  if (cat.struct && structScore(cat.struct, q) > 0) return true;
  if (matchStr(cat.macosVersion, q)) return true;
  return false;
}

function structMatches(name, q) {
  if (!q) return true;
  return structScore(name, q) > 0;
}

function enumMatches(name, q) {
  if (!q) return true;
  const e = D.enums[name];
  if (!e) return false;
  if (matchStr(name, q) || matchStr(e.brief, q)) return true;
  return e.values.some(v => matchStr(v.name, q) || matchStr(v.doc, q));
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function compareMacOS(a, b) {
  const ap = (a || '0').split('.').map(Number);
  const bp = (b || '0').split('.').map(Number);
  for (let i = 0; i < Math.max(ap.length, bp.length); i++) {
    const d = (ap[i] || 0) - (bp[i] || 0);
    if (d !== 0) return d;
  }
  return 0;
}

function highlightSource(raw) {
  const KW = new Set(['typedef','struct','union','enum','const','bool','void','true','false','_Nonnull','_Nullable','_Bool']);
  const out = [];
  let i = 0;
  const n = raw.length;
  while (i < n) {
    if (raw[i] === '/' && i+1 < n && raw[i+1] === '*') {
      const end = raw.indexOf('*/', i+2);
      const seg = end === -1 ? raw.slice(i) : raw.slice(i, end+2);
      out.push(`<span class="src-comment">${esc(seg)}</span>`);
      i = end === -1 ? n : end+2;
    } else if (raw[i] === '/' && i+1 < n && raw[i+1] === '/') {
      let end = raw.indexOf('\n', i);
      if (end === -1) end = n;
      out.push(`<span class="src-comment">${esc(raw.slice(i, end))}</span>`);
      i = end;
    } else if (/[a-zA-Z_]/.test(raw[i])) {
      let j = i;
      while (j < n && /\w/.test(raw[j])) j++;
      const word = raw.slice(i, j);
      if (KW.has(word)) {
        out.push(`<span class="src-kw">${esc(word)}</span>`);
      } else if (/^[a-z]\w*_t$/.test(word) || word.startsWith('es_') || word.startsWith('audit_') || word.startsWith('mach_')) {
        out.push(`<span class="src-type">${esc(word)}</span>`);
      } else {
        out.push(esc(word));
      }
      i = j;
    } else {
      out.push(esc(raw[i]));
      i++;
    }
  }
  return out.join('');
}

// ─── Apple docs helper ────────────────────────────────────────────────────────
function appleDocsUrl(name) {
  if (!name || !name.startsWith('es_')) return null;
  return `https://developer.apple.com/documentation/endpointsecurity/${name.toLowerCase()}`;
}

function appleDocsAnchor(name) {
  const url = appleDocsUrl(name);
  if (!url) return '';
  return `<a href="${url}" target="_blank" rel="noopener" class="apple-docs-link">Apple Docs ↗</a>`;
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
let collapsedSections = new Set();

function catItem(cat) {
  const active = state.selected?.kind === 'event' && state.selected?.name === cat.category;
  const badges = cat.isReserved
    ? '<span class="badge badge-reserved">RSVD</span>'
    : [...cat.actions].sort().map(a => `<span class="badge badge-${a.toLowerCase()}">${a}</span>`).join('');
  const ver = cat.macosVersion ? `<span class="macos">${cat.macosVersion}</span>` : '';
  return `<div class="sb-item${active?' active':''}" data-kind="event" data-name="${esc(cat.category)}">
    <span class="name">${esc(cat.category)}</span>
    <span class="badges">${badges}</span>${ver}
  </div>`;
}

function renderSidebar() {
  const q  = state.query.toLowerCase();
  const sb = document.getElementById('sidebar');
  const parts = [];

  const visibleCats = sortedCats.filter(cat => {
    if (!catMatches(cat, q)) return false;
    if (cat.isReserved) return state.showReserved || !!q;
    const hasAuth   = cat.actions.has('AUTH');
    const hasNotify = cat.actions.has('NOTIFY');
    if (!state.showAuth   && hasAuth   && !hasNotify) return false;
    if (!state.showNotify && hasNotify && !hasAuth)   return false;
    if (!state.showAuth && !state.showNotify)          return false;
    if (state.minMacOS && compareMacOS(cat.macosVersion, state.minMacOS) > 0) return false;
    return true;
  });

  const classBtn = `<button class="class-view-btn${state.classView?' active':''}" id="btn-class-view" title="Group by telemetry class">⊞</button>`;
  const evCollapsed = collapsedSections.has('events');
  parts.push(sectionHdr('events', 'Events', visibleCats.length, evCollapsed, classBtn));
  if (!evCollapsed) {
    parts.push('<div class="section-body">');
    if (state.classView) {
      const classCats = {};
      for (const cat of visibleCats) {
        const cls = cat.telemetryClass || 'Other';
        (classCats[cls] = classCats[cls] || []).push(cat);
      }
      const classOrder = Object.keys(TELEMETRY_CLASSES).filter(c => classCats[c]);
      if (classCats['Other']) classOrder.push('Other');
      for (const cls of classOrder) {
        const cats = classCats[cls];
        const collapsed = state.collapsedClasses.has(cls);
        parts.push(`<div class="class-sec-hdr${collapsed?' collapsed':''}" data-class="${esc(cls)}">
          <span><span class="class-sec-name">${esc(cls)}</span> <span class="class-sec-count">${cats.length}</span></span>
          <span class="class-sec-arrow">▾</span>
        </div>`);
        if (!collapsed) for (const cat of cats) parts.push(catItem(cat));
      }
    } else {
      for (const cat of visibleCats) parts.push(catItem(cat));
    }
    parts.push('</div>');
  }

  const visibleStructs = sortedStructs.filter(n => structMatches(n, q));
  const stCollapsed = collapsedSections.has('structs');
  parts.push(sectionHdr('structs', 'Structs', visibleStructs.length, stCollapsed));
  if (!stCollapsed) {
    parts.push('<div class="section-body">');
    for (const name of visibleStructs) {
      const active = state.selected?.kind === 'struct' && state.selected?.name === name;
      parts.push(`<div class="sb-item${active?' active':''}" data-kind="struct" data-name="${esc(name)}">
        <span class="name">${esc(name)}</span>
      </div>`);
    }
    parts.push('</div>');
  }

  const visibleEnums = sortedEnums.filter(n => enumMatches(n, q));
  const enCollapsed = collapsedSections.has('enums');
  parts.push(sectionHdr('enums', 'Enums', visibleEnums.length, enCollapsed));
  if (!enCollapsed) {
    parts.push('<div class="section-body">');
    for (const name of visibleEnums) {
      const active = state.selected?.kind === 'enum' && state.selected?.name === name;
      parts.push(`<div class="sb-item${active?' active':''}" data-kind="enum" data-name="${esc(name)}">
        <span class="name">${esc(name)}</span>
      </div>`);
    }
    parts.push('</div>');
  }

  sb.innerHTML = parts.join('');
  sb.querySelectorAll('.sb-item').forEach(el =>
    el.addEventListener('click', () => navigate(el.dataset.kind, el.dataset.name))
  );
  sb.querySelectorAll('.section-hdr').forEach(el =>
    el.addEventListener('click', () => {
      const id = el.dataset.section;
      collapsedSections.has(id) ? collapsedSections.delete(id) : collapsedSections.add(id);
      renderSidebar();
    })
  );
  sb.querySelectorAll('.class-sec-hdr').forEach(el =>
    el.addEventListener('click', () => {
      const cls = el.dataset.class;
      state.collapsedClasses.has(cls) ? state.collapsedClasses.delete(cls) : state.collapsedClasses.add(cls);
      renderSidebar();
    })
  );
  sb.querySelector('#btn-class-view')?.addEventListener('click', e => {
    e.stopPropagation();
    state.classView = !state.classView;
    renderSidebar();
  });
}

function sectionHdr(id, label, count, collapsed, extra = '') {
  return `<div class="section-hdr${collapsed?' collapsed':''}" data-section="${id}">
    <span>${label} <span class="count">${count}</span>${extra}</span>
    <span class="arrow">▾</span>
  </div>`;
}

// ─── Changelog data builder ───────────────────────────────────────────────────
// Msg version → approximate macOS version (conservative, partial inference).
// Used only for ordering and display hints — shown as "~X.x", never claimed precise.
const MSG_V_MACOS_HINT = {
  1: '10.15', 2: '10.15', 3: '11.0', 4: '12.0',
  5: '13.0',  6: '14.0',  7: '15.0', 8: '15.0',
  9: '15.0',  10: '26.0',
};

function macosHintDisplay(hint) {
  // '26.0' → '~26.x', '10.15' → '~10.15', '15.0' → '~15.x'
  if (!hint) return '';
  const parts = hint.split('.');
  if (parts.length >= 3) return `~${parts[0]}.${parts[1]}.x`;
  if (parts[parts.length - 1] === '0') return `~${parts[0]}.x`;
  return `~${hint}`;
}

function buildChangelogSections() {
  const sections = [];

  // Type A: one section per distinct macOS version (events only)
  for (const [macosV, bucket] of Object.entries(CHANGELOG.byMacOS)) {
    if (!bucket.events?.length) continue;
    sections.push({ type: 'events', macosV, events: bucket.events });
  }

  // Type B: one section per distinct msg version (struct fields only)
  for (const [vStr, bucket] of Object.entries(CHANGELOG.byMsgVersion)) {
    if (!bucket.fields?.length) continue;
    const msgV = Number(vStr);
    const hint = MSG_V_MACOS_HINT[msgV] || null;
    sections.push({ type: 'fields', msgV, macosHint: hint, fields: bucket.fields });
  }

  // Sort descending: use macosV directly for events; use macosHint (or '0') for fields
  sections.sort((a, b) => {
    const av = a.type === 'events' ? a.macosV : (a.macosHint || '0');
    const bv = b.type === 'events' ? b.macosV : (b.macosHint || '0');
    const cmp = compareMacOS(bv, av); // descending
    if (cmp !== 0) return cmp;
    // Tie-break: within same approximate macOS, events before fields,
    // then by msgV descending for fields
    if (a.type !== b.type) return a.type === 'events' ? -1 : 1;
    if (a.type === 'fields') return b.msgV - a.msgV;
    return compareMacOS(b.macosV, a.macosV);
  });

  return sections;
}

// ─── Changelog renderer ───────────────────────────────────────────────────────
function renderChangelog() {
  const sections = buildChangelogSections();
  const parts = [];

  parts.push('<div class="cl-page-hdr">');
  parts.push('<span class="cl-page-title">What\'s New</span>');
  parts.push('<button class="cl-copy-btn" data-section="all">Copy .md</button>');
  parts.push('</div>');

  if (!sections.length) {
    parts.push('<p class="placeholder">No version history available in current data.</p>');
    return parts.join('');
  }

  sections.forEach((sec, idx) => {
    parts.push('<div class="cl-section">');

    if (sec.type === 'events') {
      // Header: macOS X.Y  [Copy .md]
      parts.push('<div class="cl-ver-hdr">');
      parts.push(`<span class="cl-ver-label">macOS ${esc(sec.macosV)}</span>`);
      parts.push(`<button class="cl-copy-btn" data-section="${idx}">Copy .md</button>`);
      parts.push('</div>');

      parts.push('<div class="cl-subsection">');
      parts.push('<div class="cl-sub-hdr">New Events</div>');
      parts.push('<div class="cl-event-list">');
      for (const cat of sec.events) {
        const badge = cat.isReserved
          ? '<span class="badge badge-reserved" style="margin-left:4px">RSVD</span>'
          : [...cat.actions].sort().map(a =>
              `<span class="badge badge-${a.toLowerCase()}" style="margin-left:4px">${a}</span>`
            ).join('');
        parts.push(`<span class="cl-event-chip" data-name="${esc(cat.category)}">${esc(cat.category)}${badge}</span>`);
      }
      parts.push('</div></div>');

    } else {
      // Type: fields — header: msg vN  (~macOS X.x)  [Copy .md]
      const hint = sec.macosHint ? macosHintDisplay(sec.macosHint) : '';
      parts.push('<div class="cl-ver-hdr">');
      parts.push(`<span class="cl-ver-label">msg v${sec.msgV}</span>`);
      if (hint) parts.push(`<span class="cl-macos-hint">${esc(hint)}</span>`);
      parts.push(`<button class="cl-copy-btn" data-section="${idx}">Copy .md</button>`);
      parts.push('</div>');

      parts.push('<div class="cl-subsection">');
      parts.push('<div class="cl-sub-hdr">New Struct Fields</div>');

      const byStruct = {};
      for (const { structName, field } of sec.fields) {
        (byStruct[structName] = byStruct[structName] || []).push(field);
      }
      for (const [structName, fields] of Object.entries(byStruct).sort()) {
        parts.push('<div class="cl-struct-group">');
        parts.push(`<div class="cl-struct-name" data-ref="${esc(structName)}">${esc(structName)}</div>`);
        for (const f of fields) {
          const typeCell = (f.typeRef && (D.structs[f.typeRef] || D.enums[f.typeRef]))
            ? `<span class="type-link" data-ref="${esc(f.typeRef)}">${esc(f.type)}</span>`
            : `<span class="cl-field-type">${esc(f.type)}</span>`;
          parts.push(`<div class="cl-field-row">
            <span class="cl-field-name">${esc(f.name)}</span>
            ${typeCell}
            <span class="cl-field-doc">${esc(f.doc)}</span>
          </div>`);
        }
        parts.push('</div>');
      }
      parts.push('</div>');
    }

    parts.push('</div>'); // cl-section
  });

  return parts.join('');
}

// ─── Detail pane ──────────────────────────────────────────────────────────────
function renderDetail() {
  const el = document.getElementById('detail');

  if (state.showEventMap) {
    el.innerHTML = renderEventMap();
    el.querySelectorAll('.em-tab-btn[data-tab]').forEach(btn =>
      btn.addEventListener('click', () => {
        state.eventMapTab = btn.dataset.tab;
        renderDetail();
      })
    );
    el.querySelectorAll('.em-chip[data-name]').forEach(chip =>
      chip.addEventListener('click', () => navigate('event', chip.dataset.name))
    );
    el.querySelectorAll('.matrix-table th[data-col]').forEach(th =>
      th.addEventListener('click', () => {
        if (state.matrixSort.col === th.dataset.col) {
          state.matrixSort.dir = state.matrixSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
          state.matrixSort = { col: th.dataset.col, dir: 'asc' };
        }
        renderDetail();
      })
    );
    el.querySelectorAll('.matrix-struct[data-ref]').forEach(span =>
      span.addEventListener('click', e => {
        e.stopPropagation();
        navigate('struct', span.dataset.ref);
      })
    );
    el.querySelectorAll('tr[data-name]').forEach(row =>
      row.addEventListener('click', () => navigate('event', row.dataset.name))
    );
    return;
  }

  if (state.showChangelog) {
    if (state.isMd) {
      const md = generateChangelogMarkdown();
      const escaped = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      el.innerHTML = `<pre style="font-family:monospace;font-size:13px;line-height:1.6;padding:16px;white-space:pre-wrap;word-break:break-word">${escaped}</pre>`;
      return;
    }
    el.innerHTML = renderChangelog();
    el.querySelectorAll('.cl-struct-name[data-ref]').forEach(el =>
      el.addEventListener('click', () => navigate('struct', el.dataset.ref))
    );
    el.querySelectorAll('.cl-event-chip[data-name]').forEach(el =>
      el.addEventListener('click', () => navigate('event', el.dataset.name))
    );
    el.querySelectorAll('.cl-copy-btn[data-section]').forEach(btn =>
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const sec = btn.dataset.section;
        const text = sec === 'all' ? generateChangelogMarkdown() : generateChangelogMarkdown(+sec);
        copyToClipboard(text, btn);
      })
    );
    return;
  }

  if (!state.selected) {
    el.innerHTML = '<p class="placeholder">Select an item from the sidebar, or search.</p>';
    return;
  }
  const { kind, name } = state.selected;

  if (state.isMd) {
    const md = generateMarkdown(kind, name);
    const escaped = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    el.innerHTML = `<pre style="font-family:monospace;font-size:13px;line-height:1.6;padding:16px;white-space:pre-wrap;word-break:break-word">${escaped}</pre>`;
    return;
  }

  if      (kind === 'event')  el.innerHTML = renderEvent(name);
  else if (kind === 'struct') el.innerHTML = renderStruct(name);
  else if (kind === 'enum')   el.innerHTML = renderEnum(name);

  el.querySelectorAll('.type-link').forEach(a =>
    a.addEventListener('click', () => {
      const ref = a.dataset.ref;
      navigate(D.structs[ref] ? 'struct' : 'enum', ref);
    })
  );
  el.querySelector('#src-toggle')?.addEventListener('click', () => {
    state.showSource = !state.showSource;
    renderDetail();
  });
}

function renderEvent(category) {
  const cat = eventCats[category];
  if (!cat) return '<p class="placeholder">Event not found.</p>';
  const parts = [];

  parts.push('<div class="detail-header">');
  parts.push(`<span class="detail-title">${esc(category)}</span>`);
  if (cat.macosVersion) parts.push(`<span class="macos-tag">macOS ${esc(cat.macosVersion)}+</span>`);
  parts.push(`<a class="md-link" href="#event:${encodeURIComponent(category)}.md" title="View as Markdown">.md</a>`);
  parts.push('</div>');

  if (cat.isReserved) {
    parts.push('<div class="reserved-note">This is an undocumented / reserved event type. No public struct definition is available.</div>');
  }

  parts.push('<div class="event-tags">');
  for (const fullName of cat.fullNames.sort()) {
    const val = eventEnumValue[fullName];
    const numBadge = val !== undefined
      ? `<span class="event-tag-num">${val}</span>`
      : '';
    parts.push(`<span class="event-tag">${esc(fullName)}${numBadge}</span>`);
  }
  parts.push('</div>');

  if (!cat.isReserved && cat.struct && D.structs[cat.struct]) {
    parts.push(`<p class="detail-brief">Struct: <span class="type-link" data-ref="${esc(cat.struct)}">${esc(cat.struct)}</span> ${appleDocsAnchor(cat.struct)}</p>`);
    parts.push(renderStructBody(cat.struct));
  } else if (!cat.isReserved && cat.struct) {
    parts.push(`<p class="detail-brief">Struct: <span class="field-type">${esc(cat.struct)}</span> ${appleDocsAnchor(cat.struct)}</p>`);
  } else if (!cat.isReserved) {
    parts.push('<p class="detail-brief" style="color:var(--text3)">No struct associated with this event type.</p>');
  }

  return parts.join('');
}

function renderStruct(name) {
  const s = D.structs[name];
  if (!s) return '<p class="placeholder">Struct not found.</p>';
  const parts = [];
  parts.push('<div class="detail-header">');
  parts.push(`<span class="detail-title">${esc(name)}</span>`);
  parts.push(appleDocsAnchor(name));
  parts.push(`<a class="md-link" href="#struct:${encodeURIComponent(name)}.md" title="View as Markdown">.md</a>`);
  parts.push(`<button class="src-toggle-btn${state.showSource?' active':''}" id="src-toggle">&lt;/&gt;</button>`);
  parts.push('</div>');
  if (state.showSource) {
    parts.push(renderSource(name, 'struct'));
  } else {
    if (s.brief) parts.push(`<p class="detail-brief">${esc(s.brief)}</p>`);
    parts.push(renderStructBody(name));
  }
  return parts.join('');
}

function renderStructBody(name) {
  const s = D.structs[name];
  if (!s) return '';
  const minV  = state.minVersion;
  const parts = [];

  if (!s.fields.length) {
    parts.push('<p style="color:var(--text3);font-size:12px;margin-bottom:16px;">No public fields (opaque or reserved struct).</p>');
  } else {
    parts.push(`<table class="fields-table">
      <tr><th>Field</th><th>Type</th><th>Doc</th></tr>`);
    for (const f of s.fields) {
      const dimmed    = f.sinceVersion && f.sinceVersion > minV;
      const verBadge  = f.sinceVersion ? `<span class="badge badge-ver">v≥${f.sinceVersion}</span> ` : '';
      const unionMark = f.inUnion ? '<span class="union-mark" title="Inside union">⊂</span>' : '';
      const typeCell  = (f.typeRef && (D.structs[f.typeRef] || D.enums[f.typeRef]))
        ? `<span class="type-link" data-ref="${esc(f.typeRef)}">${esc(f.type)}</span>`
        : `<span class="field-type">${esc(f.type)}</span>`;
      parts.push(`<tr${dimmed?' class="field-dimmed"':''}>
        <td><span class="field-name">${esc(f.name)}</span>${unionMark}</td>
        <td>${verBadge}${typeCell}</td>
        <td><span class="field-doc">${esc(f.doc)}</span></td>
      </tr>`);
    }
    parts.push('</table>');
  }

  if (s.notes?.length) {
    parts.push('<div class="notes-section">');
    for (const n of s.notes) parts.push(`<div class="note">${esc(n)}</div>`);
    parts.push('</div>');
  }
  return parts.join('');
}

function renderEnum(name) {
  const e = D.enums[name];
  if (!e) return '<p class="placeholder">Enum not found.</p>';
  const parts = [];
  parts.push('<div class="detail-header">');
  parts.push(`<span class="detail-title">${esc(name)}</span>`);
  parts.push(appleDocsAnchor(name));
  parts.push(`<a class="md-link" href="#enum:${encodeURIComponent(name)}.md" title="View as Markdown">.md</a>`);
  parts.push(`<button class="src-toggle-btn${state.showSource?' active':''}" id="src-toggle">&lt;/&gt;</button>`);
  parts.push('</div>');
  if (state.showSource) {
    parts.push(renderSource(name, 'enum'));
  } else {
    if (e.brief) parts.push(`<p class="detail-brief">${esc(e.brief)}</p>`);
    parts.push(`<table class="values-table"><tr><th>Name</th><th>#</th><th>Doc</th></tr>`);
    for (const v of e.values) {
      parts.push(`<tr>
        <td><span class="val-name">${esc(v.name)}</span></td>
        <td><span class="val-num">${v.value}</span></td>
        <td><span class="val-doc">${esc(v.doc)}</span></td>
      </tr>`);
    }
    parts.push('</table>');
    if (e.notes?.length) {
      parts.push('<div class="notes-section">');
      for (const n of e.notes) parts.push(`<div class="note">${esc(n)}</div>`);
      parts.push('</div>');
    }
  }
  return parts.join('');
}

function renderSource(name, kind) {
  const item = kind === 'struct' ? D.structs[name] : D.enums[name];
  if (!item?.source) return '<p class="no-src">Source not available — re-run <code>python3 parse.py</code> to generate source data.</p>';
  return `<pre class="source-view"><code>${highlightSource(item.source)}</code></pre>`;
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function navigate(kind, name) {
  state.selected = { kind, name };
  state.showSource = false;
  state.isMd = false;
  state.showChangelog = false;
  state.showEventMap = false;
  document.getElementById('btn-changelog').classList.remove('active');
  document.getElementById('btn-eventmap').classList.remove('active');
  history.pushState({ kind, name, isMd: false }, '', `#${kind}:${encodeURIComponent(name)}`);
  renderSidebar();
  renderDetail();
  requestAnimationFrame(() => {
    document.querySelector('.sb-item.active')?.scrollIntoView({ block: 'nearest' });
    document.getElementById('detail').scrollTop = 0;
  });
}

window.addEventListener('popstate', e => {
  if (e.state) {
    if (e.state.kind === 'changelog') {
      state.showChangelog = true;
      state.showEventMap = false;
      state.selected = null;
      state.isMd = e.state.isMd ?? false;
      document.getElementById('btn-changelog').classList.add('active');
      document.getElementById('btn-eventmap').classList.remove('active');
    } else if (e.state.kind === 'eventmap') {
      state.showEventMap = true;
      state.showChangelog = false;
      state.selected = null;
      state.isMd = false;
      document.getElementById('btn-eventmap').classList.add('active');
      document.getElementById('btn-changelog').classList.remove('active');
    } else {
      state.selected = { kind: e.state.kind, name: e.state.name };
      state.isMd     = e.state.isMd ?? false;
      state.showChangelog = false;
      state.showEventMap = false;
      document.getElementById('btn-changelog').classList.remove('active');
      document.getElementById('btn-eventmap').classList.remove('active');
    }
  } else {
    restoreFromHash();
    document.getElementById('btn-changelog').classList.toggle('active', state.showChangelog);
    document.getElementById('btn-eventmap').classList.toggle('active', state.showEventMap);
  }
  state.showSource = false;
  renderSidebar();
  renderDetail();
});

window.addEventListener('hashchange', () => {
  restoreFromHash();
  state.showSource = false;
  document.getElementById('btn-changelog').classList.toggle('active', state.showChangelog);
  document.getElementById('btn-eventmap').classList.toggle('active', state.showEventMap);
  renderSidebar();
  renderDetail();
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Markdown export ──────────────────────────────────────────────────────────
function generateMarkdown(kind, name) {
  const lines = [];

  if (kind === 'event') {
    const cat = eventCats[name];
    if (!cat) return '# Not found\n';
    lines.push(`# ${name}`);
    lines.push('');
    if (cat.macosVersion) lines.push(`macOS ${cat.macosVersion}+`);
    lines.push('');
    lines.push('## Event Types');
    lines.push('');
    for (const fn of cat.fullNames.sort()) {
      const val = eventEnumValue[fn];
      const numStr = val !== undefined ? ` (${val})` : '';
      lines.push(`- \`${fn}\`${numStr}`);
    }
    lines.push('');
    if (cat.isReserved) {
      lines.push('> Undocumented / reserved event type. No public struct definition is available.');
      lines.push('');
    } else if (cat.struct) {
      lines.push(`**Struct:** \`${cat.struct}\``);
      lines.push('');
      const s = D.structs[cat.struct];
      if (s) {
        if (s.brief) { lines.push(s.brief); lines.push(''); }
        if (s.fields.length) {
          lines.push('## Fields');
          lines.push('');
          lines.push('| Field | Type | Since | Doc |');
          lines.push('|-------|------|-------|-----|');
          for (const f of s.fields) {
            const since = f.sinceVersion ? `v≥${f.sinceVersion}` : '—';
            const union = f.inUnion ? ' *(union)*' : '';
            lines.push(`| \`${f.name}\`${union} | \`${f.type}\` | ${since} | ${f.doc || ''} |`);
          }
          lines.push('');
        }
        if (s.notes?.length) {
          lines.push('## Notes');
          lines.push('');
          for (const n of s.notes) lines.push(`> ${n}`);
          lines.push('');
        }
        if (s.source) {
          lines.push('## Source');
          lines.push('');
          lines.push('```c');
          lines.push(s.source);
          lines.push('```');
          lines.push('');
        }
      }
    }
  } else if (kind === 'struct') {
    const s = D.structs[name];
    if (!s) return '# Not found\n';
    lines.push(`# ${name}`);
    lines.push('');
    if (s.brief) { lines.push(s.brief); lines.push(''); }
    if (s.fields.length) {
      lines.push('## Fields');
      lines.push('');
      lines.push('| Field | Type | Since | Doc |');
      lines.push('|-------|------|-------|-----|');
      for (const f of s.fields) {
        const since = f.sinceVersion ? `v≥${f.sinceVersion}` : '—';
        const union = f.inUnion ? ' *(union)*' : '';
        lines.push(`| \`${f.name}\`${union} | \`${f.type}\` | ${since} | ${f.doc || ''} |`);
      }
      lines.push('');
    } else {
      lines.push('*No public fields (opaque or reserved struct).*');
      lines.push('');
    }
    if (s.notes?.length) {
      lines.push('## Notes');
      lines.push('');
      for (const n of s.notes) lines.push(`> ${n}`);
      lines.push('');
    }
    if (s.source) {
      lines.push('## Source');
      lines.push('');
      lines.push('```c');
      lines.push(s.source);
      lines.push('```');
      lines.push('');
    }
  } else if (kind === 'enum') {
    const e = D.enums[name];
    if (!e) return '# Not found\n';
    lines.push(`# ${name}`);
    lines.push('');
    if (e.brief) { lines.push(e.brief); lines.push(''); }
    lines.push('## Values');
    lines.push('');
    lines.push('| Name | Value | Doc |');
    lines.push('|------|-------|-----|');
    for (const v of e.values) lines.push(`| \`${v.name}\` | ${v.value} | ${v.doc || ''} |`);
    lines.push('');
    if (e.notes?.length) {
      lines.push('## Notes');
      lines.push('');
      for (const n of e.notes) lines.push(`> ${n}`);
      lines.push('');
    }
    if (e.source) {
      lines.push('## Source');
      lines.push('');
      lines.push('```c');
      lines.push(e.source);
      lines.push('```');
      lines.push('');
    }
  }

  return lines.join('\n');
}

// ─── Event Map renderer ───────────────────────────────────────────────────────
function renderEventMap() {
  const parts = [];
  parts.push('<div class="em-page-hdr">');
  parts.push('<span class="em-page-title">Event Map</span>');
  parts.push(`<button class="em-tab-btn${state.eventMapTab==='class'?' active':''}" data-tab="class">By Class</button>`);
  parts.push(`<button class="em-tab-btn${state.eventMapTab==='matrix'?' active':''}" data-tab="matrix">Matrix</button>`);
  parts.push('</div>');
  parts.push(state.eventMapTab === 'matrix' ? renderMatrix() : renderByClass());
  return parts.join('');
}

function renderByClass() {
  const parts = [];
  // Build class → cats map, preserving TELEMETRY_CLASSES order
  const classCats = {};
  for (const cat of sortedCats) {
    const cls = cat.telemetryClass || 'Other';
    (classCats[cls] = classCats[cls] || []).push(cat);
  }
  const classOrder = [...Object.keys(TELEMETRY_CLASSES).filter(c => classCats[c])];
  if (classCats['Other']) classOrder.push('Other');

  for (const cls of classOrder) {
    const cats = classCats[cls];
    parts.push('<div class="em-class-section">');
    parts.push(`<div class="em-class-hdr"><span>${esc(cls)}</span><span class="em-class-count">${cats.length}</span></div>`);
    parts.push('<div class="em-event-list">');
    for (const cat of cats) {
      const badges = cat.isReserved
        ? '<span class="badge badge-reserved" style="margin-left:2px">RSVD</span>'
        : [...cat.actions].sort().map(a =>
            `<span class="badge badge-${a.toLowerCase()}" style="margin-left:2px">${a}</span>`
          ).join('');
      const ver = cat.macosVersion ? `<span class="em-macos">${cat.macosVersion}</span>` : '';
      parts.push(`<span class="em-chip" data-name="${esc(cat.category)}">${esc(cat.category)}${badges}${ver}</span>`);
    }
    parts.push('</div></div>');
  }
  return parts.join('');
}

function renderMatrix() {
  const { col, dir } = state.matrixSort;
  const mult = dir === 'asc' ? 1 : -1;

  const rows = [...sortedCats].sort((a, b) => {
    let av, bv;
    if (col === 'category') { av = a.category; bv = b.category; }
    else if (col === 'class') { av = (a.telemetryClass||'Other') + a.category; bv = (b.telemetryClass||'Other') + b.category; }
    else if (col === 'auth')  { av = a.actions.has('AUTH')?0:1; bv = b.actions.has('AUTH')?0:1; }
    else if (col === 'notify'){ av = a.actions.has('NOTIFY')?0:1; bv = b.actions.has('NOTIFY')?0:1; }
    else if (col === 'macos') { return mult * compareMacOS(a.macosVersion||'0', b.macosVersion||'0'); }
    else if (col === 'struct'){ av = a.struct||''; bv = b.struct||''; }
    else { av = a.category; bv = b.category; }
    return mult * (av < bv ? -1 : av > bv ? 1 : 0);
  });

  function thArr(id, label) {
    const active = col === id;
    const arrow = active ? `<span class="matrix-sort-arrow">${dir==='asc'?'▲':'▼'}</span>` : '';
    return `<th data-col="${id}">${label}${arrow}</th>`;
  }

  const parts = [];
  parts.push('<table class="matrix-table">');
  parts.push(`<thead><tr>
    ${thArr('category','Category')}
    ${thArr('class','Class')}
    ${thArr('auth','AUTH')}
    ${thArr('notify','NOTIFY')}
    ${thArr('macos','macOS')}
    ${thArr('struct','Struct')}
  </tr></thead><tbody>`);

  for (const cat of rows) {
    const auth   = cat.isReserved ? `<span class="badge badge-reserved">RSVD</span>`
                 : cat.actions.has('AUTH')   ? '<span class="matrix-check">✓</span>'
                 : '<span class="matrix-dash">—</span>';
    const notify = cat.isReserved ? '<span class="matrix-dash">—</span>'
                 : cat.actions.has('NOTIFY') ? '<span class="matrix-check">✓</span>'
                 : '<span class="matrix-dash">—</span>';
    const macos  = cat.macosVersion ? esc(cat.macosVersion) : '<span class="matrix-dash">—</span>';
    const struct = cat.struct && D.structs[cat.struct]
      ? `<span class="matrix-struct" data-ref="${esc(cat.struct)}">${esc(cat.struct)}</span>`
      : (cat.struct ? `<span class="matrix-dash">${esc(cat.struct)}</span>` : '<span class="matrix-dash">—</span>');

    parts.push(`<tr data-name="${esc(cat.category)}">
      <td><span class="matrix-cat">${esc(cat.category)}</span></td>
      <td><span class="matrix-class">${esc(cat.telemetryClass||'Other')}</span></td>
      <td>${auth}</td>
      <td>${notify}</td>
      <td>${macos}</td>
      <td>${struct}</td>
    </tr>`);
  }
  parts.push('</tbody></table>');
  return parts.join('');
}

// ─── Changelog Markdown export ───────────────────────────────────────────────
function generateChangelogMarkdown(sectionIdx) {
  const sections = buildChangelogSections();
  const lines = [];

  function renderSection(sec) {
    if (sec.type === 'events') {
      lines.push(`## macOS ${sec.macosV}`);
      lines.push('');
      lines.push('### New Events');
      lines.push('');
      for (const cat of sec.events) {
        const actions = cat.isReserved ? ['RESERVED'] : [...cat.actions].sort();
        lines.push(`- \`${cat.category}\` (${actions.join(', ')})`);
      }
      lines.push('');
    } else {
      const hint = sec.macosHint ? ` (${macosHintDisplay(sec.macosHint)})` : '';
      lines.push(`## msg v${sec.msgV}${hint}`);
      lines.push('');
      lines.push('### New Struct Fields');
      lines.push('');
      const byStruct = {};
      for (const { structName, field } of sec.fields)
        (byStruct[structName] = byStruct[structName] || []).push(field);
      for (const [structName, fields] of Object.entries(byStruct).sort()) {
        lines.push(`**\`${structName}\`**`);
        lines.push('');
        lines.push('| Field | Type | Doc |');
        lines.push('|-------|------|-----|');
        for (const f of fields)
          lines.push(`| \`${f.name}\` | \`${f.type}\` | ${f.doc || ''} |`);
        lines.push('');
      }
    }
  }

  if (sectionIdx !== undefined) {
    const sec = sections[sectionIdx];
    if (!sec) return '';
    renderSection(sec);
  } else {
    lines.push('# What\'s New');
    lines.push('');
    for (const sec of sections) renderSection(sec);
  }

  return lines.join('\n');
}

// ─── Clipboard helpers ────────────────────────────────────────────────────────
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function copyToClipboard(text, btn) {
  const orig = btn.textContent;
  const done = () => {
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

// ─── Restore from URL hash ────────────────────────────────────────────────────
function parseHash(hash) {
  const isMd = hash.endsWith('.md');
  const cleaned = isMd ? hash.slice(0, -3) : hash;
  if (cleaned === 'changelog') return { kind: 'changelog', name: null, isMd };
  if (cleaned === 'eventmap')  return { kind: 'eventmap',  name: null, isMd: false };
  const colon = cleaned.indexOf(':');
  if (colon === -1) return null;
  const kind = cleaned.slice(0, colon);
  const name = decodeURIComponent(cleaned.slice(colon + 1));
  const valid = (kind === 'event'  && eventCats[name]) ||
                (kind === 'struct' && D.structs[name]) ||
                (kind === 'enum'   && D.enums[name]);
  return valid ? { kind, name, isMd } : null;
}

function restoreFromHash() {
  const parsed = parseHash(location.hash.slice(1));
  if (parsed?.kind === 'changelog') {
    state.showChangelog = true;
    state.showEventMap = false;
    state.selected = null;
    state.isMd = parsed.isMd;
  } else if (parsed?.kind === 'eventmap') {
    state.showEventMap = true;
    state.showChangelog = false;
    state.selected = null;
    state.isMd = false;
  } else {
    state.showChangelog = false;
    state.showEventMap = false;
    state.selected = parsed ? { kind: parsed.kind, name: parsed.name } : null;
    state.isMd     = parsed?.isMd ?? false;
    if (!parsed) state.showChangelog = true;
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Populate macOS filter options
{
  const versions = [...new Set(D.events.map(e => e.macosVersion).filter(Boolean))].sort(compareMacOS);
  for (const v of versions) {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = `macOS ${v}`;
    macosFilter.appendChild(opt);
  }
}

applyPrefs();
restoreFromHash();
renderSidebar();
if (state.showChangelog) document.getElementById('btn-changelog')?.classList.add('active');
if (state.showEventMap)  document.getElementById('btn-eventmap')?.classList.add('active');
renderDetail();
</script>
</body>
</html>
