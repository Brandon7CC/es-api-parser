repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff          # lint
      - id: ruff-format   # format check (no auto-fix, just fails if unformatted)
        args: [--check]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast     # fast syntax check (catches IndentationError, SyntaxError)
        files: \.py$
